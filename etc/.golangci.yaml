version: "2"
run:
  timeout: 10m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - revive
    - unconvert
    - unparam
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
  settings:
    errcheck:
      check-blank: false
    gosec:
      excludes:
        - G304 # file paths come from the module root
        - G703 # same: moduleRoot() joins VIAM_MODULE_ROOT / the executable dir, not user input
        - G404 # math/rand is not used for security
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
      - path: tools/
        linters:
          - gosec
formatters:
  enable:
    - gofmt
    - goimports
