name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/viamrobotics/rdk-devenv:amd64
    steps:
      - uses: actions/checkout@v4
      - name: Mark checkout safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
